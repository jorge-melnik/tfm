@let pedido = this.pedido();
<div
  class="p-5 border border-surface-200 dark:border-surface-700 rounded-xl bg-surface-0 dark:bg-surface-900 shadow-sm space-y-4"
>
  <!-- Cabecera por Productor -->
  <div
    class="flex items-center justify-between border-b border-surface-200 dark:border-surface-800 pb-3"
  >
    <div class="flex items-center gap-2">
      <svg data-p-icon="shop" class="w-4 h-4 text-primary"></svg>
      <a
        [routerLink]="['..', 'productor', pedido.productor]"
        class="font-bold text-surface-900 dark:text-surface-0 text-sm hover:text-primary transition-colors cursor-pointer"
      >
        Productor: {{ pedido.productor }}
      </a>
    </div>
    <p-tag
      [value]="pedido.estado_pedido"
      [severity]="obtenerSeveridadEstado(pedido.estado_pedido)"
    />
  </div>

  <!-- Lista de productos de este pedido -->
  <div class="divide-y divide-surface-200 dark:divide-surface-800">
    @for (prod of pedido.productos; track prod.nombre) {
      <div class="py-3 flex items-center justify-between gap-4 first:pt-0 last:pb-0">
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-lg bg-surface-100 dark:bg-surface-800 flex items-center justify-center shrink-0"
          >
            <app-foto-carrusel altText="imagenes" [fotos]="prod.imagenes"></app-foto-carrusel>
          </div>
          <div>
            <p class="font-medium text-surface-900 dark:text-surface-0 m-0 text-sm">
              {{ prod.nombre }}
            </p>
            <p class="text-xs text-surface-500 dark:text-surface-400 m-0">
              {{ prod.cantidad }} x {{ prod.precio | currency }}
            </p>
          </div>
        </div>
        <span class="font-semibold text-surface-900 dark:text-surface-0 text-sm">
          {{ prod.subtotal | currency }}
        </span>
      </div>
    }
  </div>

  <div class="pt-2 flex justify-end border-t border-surface-200 dark:border-surface-800">
    <span class="text-xs text-surface-500 dark:text-surface-400">
      Subtotal pedido:
      <strong class="text-surface-900 dark:text-surface-0">{{
        pedido.subtotal_pedido | currency
      }}</strong>
    </span>
  </div>
</div>
