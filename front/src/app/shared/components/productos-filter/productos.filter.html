<div
  class="flex flex-col gap-4 p-4 bg-surface-50 dark:bg-surface-950 border-b border-surface-200 dark:border-surface-800"
>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
    <p-select
      #slugCategoria
      [options]="this.categoriasResource.value()"
      [(ngModel)]="this.categoriaSeleccionada"
      (onChange)="this.onCategoriaChange($event.value)"
      optionLabel="categoria"
      optionValue="categoria"
      appendTo="body"
      class="w-full"
      [showClear]="true"
      placeholder="Categoría"
    >
      <ng-template let-categoria #item>
        <div class="flex items-center gap-2">
          <i [class]="categoria.icono" style="font-size: 1.2rem"></i>
          <div>{{ categoria.categoria }}</div>
        </div>
      </ng-template>
    </p-select>

    <p-select
      [options]="this.subcategoriasResource.value()"
      [(ngModel)]="subcategoriaSeleccionada"
      (onChange)="this.onSubcategoriaChange(slugCategoria.value, $event.value)"
      optionLabel="subcategoria"
      optionValue="subcategoria"
      appendTo="body"
      class="w-full"
      [showClear]="true"
      placeholder="Subcategoría"
    />

    <p-select
      multiple="true"
      [options]="this.etiquetasResource.value()"
      [(ngModel)]="this.etiquetasSeleccionadas"
      (onChange)="this.onEtiquetasChange($event.value)"
      placeholder="Etiquetas"
      class="w-full"
      display="chip"
      optionLabel="nombre"
      optionValue="etiqueta"
      appendTo="body"
      [showClear]="true"
    />

    <!-- <button
            pButton
            icon="pi pi-filter-slash"
            class="button pButton-outlined w-full"
          >Limpiar Filtros</button> -->
    <div class="relative w-full">
      <input
        type="text"
        [(ngModel)]="this.filtroBusqueda"
        (ngModelChange)="this.filtroCambiado.emit()"
        placeholder="🔍 Buscar por nombre o descripción..."
        class="w-full px-3 py-2 border rounded-md bg-surface-0 dark:bg-surface-900 border-surface-300 dark:border-surface-700 text-surface-900 dark:text-surface-0"
      />
    </div>

    <p-select
      [options]="this.sortOptions"
      [(ngModel)]="this.sortKey"
      placeholder="Ordenar por..."
      (onChange)="this.onSortChange($event)"
      class="mb-2 md:mb-0"
    />

    <div class="flex justify-end">
      <p-selectbutton [(ngModel)]="this.layout" [options]="['grid', 'list']" [allowEmpty]="false">
        <ng-template #item let-item>
          <i class="pi" [class]="{ 'pi-bars': item === 'list', 'pi-table': item === 'grid' }"></i>
        </ng-template>
      </p-selectbutton>
    </div>
  </div>
</div>
