<div
  class="p-5 border border-surface-200 dark:border-surface-700 rounded-xl bg-surface-0 dark:bg-surface-900 shadow-sm"
>
  <h2
    class="text-lg font-semibold text-surface-900 dark:text-surface-0 mb-4 flex items-center gap-2"
  >
    <i class="pi pi-credit-card text-primary"></i>
    Selecciona el método de pago
  </h2>

  <div class="flex flex-wrap justify-center">
    <div class="flex flex-col w-full gap-2">
      @for (plan of this.mediosDePago(); track plan.codigo) {
        <label
          pLabel
          class="flex items-start gap-3 p-3 rounded-md border cursor-pointer"
          [class]="
            this.medioDePagoSeleccionado() === plan.codigo ? 'border-primary' : 'border-surface'
          "
        >
          <p-radiobutton
            name="plan"
            [value]="plan.codigo"
            [(ngModel)]="this.medioDePagoSeleccionado"
          />
          <div class="flex flex-col gap-0.5">
            <span class="font-medium">{{ plan.nombre }}</span>
            <span class="text-xs text-surface-500">{{ plan.descripcion }}</span>
          </div>
        </label>
      }
    </div>
  </div>
</div>
