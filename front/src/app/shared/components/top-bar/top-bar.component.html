<header class="flex items-center justify-between px-2 py-3 text-white shadow-md sticky top-0 z-50">
  <div class="flex items-center gap-2 cursor-pointer" [routerLink]="['/']">
    <img src="/images/logo.webp" alt="Logo De Acá" class="h-10 w-auto object-contain" />
  </div>

  <p-menu #menu [model]="items()" [popup]="true" />

  <button pButton [rounded]="true" [text]="true" severity="secondary" (click)="menu.toggle($event)">
    <i class="pi pi-user"></i>
  </button>
</header>
