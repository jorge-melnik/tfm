<div class="flex flex-column h-full">
  <p-confirmDialog />
  <p-toast />
  <app-top-bar></app-top-bar>

  <main class="flex-grow-1 overflow-y-auto bg-surface-ground">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-white border-top-1 border-300 shadow-5">
    <p-tabs [value]="0">
      <p-tablist>
        <p-tab [value]="0" class="flex-grow-1" [routerLink]="['/', 'admin']">
          <div class="flex flex-column align-items-center gap-1">
            <i class="pi pi-home text-xl"></i>
            <span class="text-xs">Inicio</span>
          </div>
        </p-tab>

        <p-tab [value]="1" class="flex-grow-1" [routerLink]="['/', 'admin', 'categorias']">
          <div class="flex flex-column align-items-center gap-1">
            <i class="pi pi-tags text-xl"></i>
            <span class="text-xs">Categorias</span>
          </div>
        </p-tab>

        <p-tab [value]="2" class="flex-grow-1" [routerLink]="['/', 'admin', 'subcategorias']">
          <div class="flex flex-column align-items-center gap-1">
            <i class="pi pi-tags text-xl"></i>
            <span class="text-xs">Subcategorias</span>
          </div>
        </p-tab>

        <p-tab [value]="3" class="flex-grow-1" [routerLink]="['/', 'admin', 'etiquetas']">
          <div class="flex flex-column align-items-center gap-1">
            <i class="pi pi-bookmark text-xl"></i>
            <span class="text-xs">Etiquetas</span>
          </div>
        </p-tab>
      </p-tablist>
    </p-tabs>
  </footer>
</div>
