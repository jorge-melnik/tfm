<div class="flex flex-column h-full" style="border: 2px solid black">
  <header class="flex align-items-center justify-content-between px-4 py-2 bg-primary shadow-2 z-5">
    <div class="flex align-items-center gap-2">
      <i class="pi pi-shopping-bag text-2xl"></i>
      <span class="font-bold text-xl">De Acá</span>
    </div>
    <p-button
      icon="pi pi-user"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      styleClass="text-white"
    />
  </header>

  <main class="flex-grow-1 overflow-y-auto bg-surface-ground">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-white border-top-1 border-300 shadow-5">
    <p-tabs [value]="0">
      <p-tablist>
        <p-tab [value]="0" class="flex-grow-1" [routerLink]="['/', 'admin']">
          <div class="flex flex-column align-items-center gap-1">
            <i class="pi pi-home text-xl"></i>
            <span class="text-xs">Inicio</span>
          </div>
        </p-tab>

        <p-tab [value]="1" class="flex-grow-1" [routerLink]="['/', 'admin', 'categorias']">
          <div class="flex flex-column align-items-center gap-1">
            <i class="pi pi-shopping-cart text-xl"></i>
            <span class="text-xs">Categorias</span>
          </div>
        </p-tab>

        <p-tab [value]="2" class="flex-grow-1" [routerLink]="['/', 'admin', 'etiquetas']">
          <div class="flex flex-column align-items-center gap-1">
            <i class="pi pi-box text-xl"></i>
            <span class="text-xs">Etiquetas</span>
          </div>
        </p-tab>
      </p-tablist>
    </p-tabs>
  </footer>
</div>
