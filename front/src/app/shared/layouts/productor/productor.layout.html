<div class="flex flex-column h-full">
  <app-top-bar></app-top-bar>

  <main class="flex-grow-1 overflow-y-auto bg-surface-ground">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-white border-top-1 border-300 shadow-5">
    <p-tabs [value]="0">
      <p-tablist>
        <p-tab [value]="0" class="flex-grow-1" [routerLink]="['/', 'productor']">
          <div class="flex flex-column align-items-center gap-1">
            <i class="pi pi-home text-xl"></i>
            <span class="text-xs">Inicio</span>
          </div>
        </p-tab>

        <p-tab [value]="1" class="flex-grow-1" [routerLink]="['/', 'productor', 'productos']">
          <div class="flex flex-column align-items-center gap-1">
            <i class="pi pi-objects-column text-xl"></i>
            <span class="text-xs">Productos</span>
          </div>
        </p-tab>

        <p-tab [value]="2" class="flex-grow-1" [routerLink]="['/', 'productor', 'pedidos']">
          <div class="flex flex-column align-items-center gap-1">
            <i class="pi pi-receipt text-xl"></i>
            <span class="text-xs">Pedidos</span>
          </div>
        </p-tab>
      </p-tablist>
    </p-tabs>
  </footer>
</div>
