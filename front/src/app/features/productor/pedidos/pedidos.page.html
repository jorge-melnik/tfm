<div class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-surface-900 dark:text-surface-0 m-0">
        Gestión de Pedidos
      </h1>
      <p class="text-sm text-surface-500 dark:text-surface-400 mt-1 m-0">
        Administra los pedidos recibidos para tus productos y actualiza sus estados.
      </p>
    </div>

    <p-selectbutton
      [options]="opcionesEstado"
      [(ngModel)]="estadoFiltro"
      optionLabel="label"
      optionValue="value"
      (onChange)="onFiltroChange()"
    />
  </div>

  <p-dataview
    [value]="this.pedidos()"
    [loading]="this.isLoading()"
    [paginator]="true"
    [rows]="this.paginationStore.limit()"
    [first]="this.paginationStore.first()"
    [totalRecords]="this.total()"
    [lazy]="true"
    [rowsPerPageOptions]="this.paginationStore.rowsPerPageOptions()"
    (onPage)="this.paginationStore.onPageChange($event)"
    layout="list"
  >
    <ng-template #list let-items>
      <div class="space-y-4">
        @for (pedido of items; track pedido.id_pedido) {
          <app-vista-pedido [pedido]="pedido" (cambiarEstado)="onCambiarEstadoPedido($event)" />
        }
      </div>
    </ng-template>

    <ng-template #loading>
      <div class="space-y-4">
        <div class="h-44 bg-surface-200 dark:bg-surface-800 animate-pulse rounded-xl"></div>
        <div class="h-44 bg-surface-200 dark:bg-surface-800 animate-pulse rounded-xl"></div>
      </div>
    </ng-template>

    <ng-template #empty>
      <div
        class="p-8 text-center border border-surface-200 dark:border-surface-700 rounded-xl bg-surface-0 dark:bg-surface-900"
      >
        <svg data-p-icon="inbox" class="w-12 h-12 text-surface-400 mx-auto mb-3"></svg>
        <h3 class="text-lg font-bold text-surface-900 dark:text-surface-0">
          No hay pedidos disponibles
        </h3>
        <p class="text-sm text-surface-500">
          No se encontraron pedidos con los filtros seleccionados.
        </p>
      </div>
    </ng-template>
  </p-dataview>
</div>
