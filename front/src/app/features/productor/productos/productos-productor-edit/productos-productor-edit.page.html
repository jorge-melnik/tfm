<div class="flex flex-col grow justify-center items-center h-full p-4 my-8">
  @if (this.productoResource.hasValue()) {
    <app-producto-form
      [producto]="this.productoResource.value()"
      (cancelar)="this.volver()"
      (guardar)="this.guardarProducto($event)"
    ></app-producto-form>
  } @else {
    <p>No se pudo cargar el producto.</p>
  }
</div>
