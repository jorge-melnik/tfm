<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
  <div
    class="lg:col-span-2 card p-0 rounded-2xl overflow-hidden border border-surface-200 dark:border-surface-700"
  >
    <div class="flex justify-between items-center px-4 py-3 bg-surface-50 dark:bg-surface-850">
      <h3 class="text-base font-bold text-surface-800 dark:text-surface-200 m-0">Mi Carrito</h3>
      <p-tag [value]="this.items().length + ' Productos'" severity="secondary" />
    </div>
    <p-dataview #dv [value]="this.items()" layout="list" emptyMessage="">
      <ng-template #list let-myitems>
        <div class="flex flex-col">
          @for (item of myitems; track item.id_item) {
            <app-item-carrito
              [item]="item"
              (actualizar)="this.onActualizar($event)"
              (borrar)="this.onBorrar($event)"
            />
          }
        </div>
      </ng-template>
      <ng-template #emptymessage>
        <div class="flex flex-col items-center justify-center py-12 text-surface-400">
          <i class="pi pi-shopping-cart text-5xl mb-3"></i>
          <p class="m-0 font-medium">Tu carrito está vacío</p>
        </div>
      </ng-template>
    </p-dataview>
  </div>

  @if (this.items().length > 0) {
    <div
      class="h-fit card p-5 border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 rounded-2xl shadow-xs"
    >
      <h3 class="text-lg font-bold text-surface-900 dark:text-surface-0 mb-4 m-0">
        Resumen del pedido
      </h3>

      <div class="flex flex-col gap-3">
        <div class="flex flex-col gap-1.5">
          <p-floatlabel variant="on" class="w-full">
            <p-select
              id="ubicacion"
              [options]="ubicaciones()"
              [(ngModel)]="this.ubicacionSeleccionada"
              optionLabel="direccion"
              [loading]="this.ubicacionesResource.isLoading()"
              class="w-full text-sm"
              styleClass="w-full"
            >
              <!-- Template en caso de no tener direcciones guardadas -->
              <ng-template pTemplate="empty">
                <span class="text-sm p-2 block">No tienes ubicaciones registradas.</span>
              </ng-template>
            </p-select>
            <label for="ubicacion">Ubicación de envío</label>
          </p-floatlabel>

          <p-floatlabel variant="on" class="w-full">
            <p-iconfield iconPosition="right">
              <p-inputicon>
                <svg data-p-icon="phone"></svg>
              </p-inputicon>
              <input
                pInputText
                name="contacto_receptor"
                autocomplete="off"
                class="w-full"
                [(ngModel)]="this.contacto_receptor"
              />
              <label for="celular">Contacto receptor</label>
            </p-iconfield>
          </p-floatlabel>
        </div>

        <div class="flex justify-between text-sm text-surface-500 mt-2">
          <span>Subtotal productos</span>
          <span>{{ totalCarrito() }}</span>
        </div>

        <div class="flex justify-between text-sm text-surface-500">
          <span>Envío / Entrega</span>
          <span class="text-emerald-650 font-medium">A coordinar</span>
        </div>

        <div class="w-full h-[1px] bg-surface-200 dark:bg-surface-700 my-1"></div>

        <div class="flex justify-between items-baseline">
          <span class="text-base font-bold text-surface-900 dark:text-surface-0">Total</span>
          <span class="text-2xl font-black text-emerald-600 dark:text-emerald-400">
            {{ totalCarrito() }}
          </span>
        </div>

        <div class="flex justify-center items-baseline pt-2">
          <button
            pButton
            [disabled]="!ubicacionSeleccionada() || ubicacionesResource.isLoading()"
            (click)="confirmarCompra()"
            class="w-full"
          >
            <svg data-p-icon="check"></svg>
            Confirmar Compra
          </button>
        </div>
      </div>
    </div>
  }
</div>
