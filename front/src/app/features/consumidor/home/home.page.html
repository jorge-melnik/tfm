<div class="card">
  <p-dataview
    #dv
    [value]="this.productosResource.value()?.data"
    [layout]="this.layout()"
    [paginator]="true"
    [rows]="this.limit()"
    [first]="this.first()"
    [totalRecords]="30"
    [lazy]="true"
    [rowsPerPageOptions]="[5, 10, 15]"
    (onPage)="this.onPageChange($event)"
    [sortField]="this.sortField()"
    [sortOrder]="this.sortOrder()"
  >
    <ng-template #header>
      <div
        class="flex flex-col gap-4 p-4 bg-surface-50 dark:bg-surface-950 border-b border-surface-200 dark:border-surface-800"
      >
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="relative w-full">
            <input
              type="text"
              [ngModel]="filtroBusqueda()"
              (ngModelChange)="filtroBusqueda.set($event)"
              placeholder="🔍 Buscar por nombre o descripción..."
              class="w-full px-3 py-2 border rounded-md bg-surface-0 dark:bg-surface-900 border-surface-300 dark:border-surface-700 text-surface-900 dark:text-surface-0"
            />
          </div>

          <p-select
            [options]="this.sortOptions"
            [(ngModel)]="this.sortKey"
            placeholder="Ordenar por..."
            (onChange)="this.onSortChange($event)"
            class="mb-2 md:mb-0"
          />

          <div class="flex justify-end">
            <p-selectbutton
              [(ngModel)]="this.layout"
              [options]="['grid', 'list']"
              [allowEmpty]="false"
            >
              <ng-template #item let-item>
                <i
                  class="pi"
                  [class]="{ 'pi-bars': item === 'list', 'pi-table': item === 'grid' }"
                ></i>
              </ng-template>
            </p-selectbutton>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-center">
          <p-select
            [options]="this.categoriasResource.value()"
            [(ngModel)]="this.categoriaSeleccionada"
            optionLabel="slug_categoria"
            optionValue="slug_categoria"
            appendTo="body"
            class="w-full"
            [showClear]="true"
            placeholder="Categoría"
          >
            <ng-template let-categoria #item>
              <div class="flex items-center gap-2">
                <i [class]="categoria.icono" style="font-size: 1.2rem"></i>
                <div>{{ categoria.slug_categoria }}</div>
              </div>
            </ng-template>
          </p-select>

          <p-select
            [options]="this.subcategoriasResource.value()"
            [(ngModel)]="subcategoriaSeleccionada"
            optionLabel="slug_subcategoria"
            optionValue="slug_subcategoria"
            appendTo="body"
            class="w-full"
            [showClear]="true"
            placeholder="Subcategoría"
          />

          <p-multiSelect
            [options]="this.etiquetasResource.value()"
            [(ngModel)]="etiquetasSeleccionadas"
            placeholder="Etiquetas"
            class="w-full"
            display="chip"
            optionLabel="nombre"
            appendTo="body"
            [maxSelectedLabels]="3"
          />

          <button
            pButton
            label="Limpiar Filtros"
            icon="pi pi-filter-slash"
            class="p-button-outlined w-full"
          ></button>
        </div>
      </div>
    </ng-template>

    <ng-template #list let-productos>
      <div class="flex flex-col gap-4 mt-4">
        @for (producto of productos; track producto.id_producto) {
          <app-producto-card
            [producto]="producto"
            [layout]="'list'"
            [cdnUrl]="this.cdnUrl"
            (agregarAlCarrito)="this.agregarAlCarrito($event)"
          />
        }
      </div>
    </ng-template>

    <ng-template #grid let-items>
      <div
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 mt-4"
      >
        @for (producto of items; track producto.id_producto) {
          <app-producto-card
            [producto]="producto"
            [layout]="'grid'"
            [cdnUrl]="this.cdnUrl"
            (agregarAlCarrito)="this.agregarAlCarrito($event)"
          />
        }
      </div>
    </ng-template>
  </p-dataview>
</div>
