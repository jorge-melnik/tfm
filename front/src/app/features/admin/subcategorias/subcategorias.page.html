<app-admin-table
  [isLoading]="this.resource.isLoading()"
  [data]="this.resource.value()"
  [editableColumns]="['nombre', 'id_categoria', 'id_etiquetas']"
  id="id_subcategoria"
  title="Subcategorias"
  [columns]="this.columns"
  (refresh)="this.resource.reload()"
  (remove)="this.remove($event)"
  (create)="this.create($event)"
  (update)="this.update($event)"
  [categorias]="this.categoriasResource.value()"
  [etiquetas]="this.etiquetasResource.value()"
></app-admin-table>
