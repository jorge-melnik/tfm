@let pedido = this.pedido();

<div class="w-full max-w-7xl mx-auto p-2 flex-1 h-full min-h-0 box-border overflow-hidden">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 w-full h-full min-h-0">
    <!-- Columna Izquierda: Detalle del Pedido -->
    <div class="w-full h-full min-h-0 overflow-y-auto">
      @if (pedidoResource.isLoading() && !pedido) {
        <div
          class="p-8 text-center text-surface-400 bg-surface-0 dark:bg-surface-900 rounded-xl border border-surface-200 dark:border-surface-700"
        >
          <i class="pi pi-spin pi-spinner text-2xl mb-2"></i>
          <p class="m-0 text-sm">Cargando información del pedido...</p>
        </div>
      } @else if (pedidoResource.error() && !pedido) {
        <div
          class="p-4 bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-800 rounded-xl text-rose-600 dark:text-rose-400 text-sm"
        >
          Ocurrió un error al cargar el pedido. Intenta nuevamente más tarde.
        </div>
      } @else if (pedido) {
        <app-vista-pedido
          [pedido]="pedido"
          (cambiarEstado)="this.onCambiarEstadoPedido($event)"
          class="w-full block"
        />
      }
    </div>

    <!-- Columna Derecha / Abajo: Chat del Pedido (Ocupa todo el alto) -->
    <div class="w-full h-full min-h-0 flex flex-col overflow-hidden">
      <app-chats-pedido
        class="w-full h-full flex flex-col min-h-0"
        [mensajes]="this.mensajes()"
        (mensajeEmitido)="this.onMensajeEmitido($event)"
      ></app-chats-pedido>
    </div>
  </div>
</div>
