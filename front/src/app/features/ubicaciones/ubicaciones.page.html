<div class="map-wrapper relative w-full h-full">
  <!-- Cabecera sobre el mapa -->
  <div class="absolute top-3 inset-x-3 z-10 flex items-center justify-between pointer-events-none">
    <!-- Título de la sección -->
    <div
      class="flex items-center gap-2 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-slate-200/80 shadow-sm pointer-events-auto"
    >
      <svg data-p-icon="map-marker" class="w-5 h-5 text-emerald-600"></svg>
      <h2 class="text-base font-bold text-slate-800 m-0">Mis ubicaciones</h2>
    </div>

    <!-- Botón / Banner dinámico según el modo -->
    @if (!modoSeleccionActivo()) {
      <button
        type="button"
        pButton
        class="p-button-sm p-button-emerald shadow-md pointer-events-auto"
        (click)="activarModoNuevaUbicacion()"
      >
        <svg data-p-icon="plus"></svg>
        <span>Nueva Ubicación</span>
      </button>
    } @else {
      <div
        class="flex items-center gap-2 bg-emerald-600 text-white px-3 py-1.5 rounded-lg shadow-md pointer-events-auto animate-pulse"
      >
        <svg data-p-icon="map-marker" class="w-4 h-4"></svg>
        <span class="text-xs font-semibold">Haz clic en el mapa para ubicar</span>
        <button
          type="button"
          pButton
          class="p-button-rounded p-button-text p-button-sm text-white hover:bg-emerald-700 ml-1 !p-1"
          (click)="cancelarSeleccion()"
        >
          <svg data-p-icon="times"></svg>
        </button>
      </div>
    }
  </div>

  <!-- Contenedor del Mapa -->
  <div #mapContainer class="w-full h-125 rounded-xl overflow-hidden border border-slate-200"></div>

  <!-- Popup existente... -->
  <div #popupContainer class="ol-popup w-fit max-w-xs">
    <!-- ... -->
  </div>
</div>

<!-- Diálogo de Edición / Creación -->
<p-dialog
  [header]="esNuevaUbicacion() ? 'Nueva Ubicación' : 'Editar Ubicación'"
  [visible]="modalEdicionAbierto()"
  (visibleChange)="modalEdicionAbierto.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-full max-w-md"
>
  <form (submit)="$event.preventDefault(); guardarEdicion()" class="space-y-5 pt-3">
    <!-- Campo Nombre -->
    <p-floatlabel variant="on" class="w-full">
      <input type="text" pInputText class="w-full" [formField]="this.ubicacionForm.nombre" />
      <label for="nombre">Nombre</label>
    </p-floatlabel>

    <!-- Campo Dirección -->
    <p-floatlabel variant="on" class="w-full">
      <input
        id="direccion"
        type="text"
        pInputText
        autocomplete="off"
        class="w-full"
        [formField]="this.ubicacionForm.direccion"
      />
      <label for="direccion">Dirección</label>
    </p-floatlabel>

    <div class="grid grid-cols-2 gap-3">
      <p-floatlabel variant="on" class="w-full">
        <p-select
          name="departamento"
          [options]="departamentos()"
          optionLabel="nombre"
          optionValue="id_departamento"
          class="w-full"
          appendTo="body"
          [filter]="true"
          [formField]="this.ubicacionForm.id_departamento"
          /* [(ngModel)]="this.departamentoSeleccionado" */
        ></p-select>
        <label for="departamento">Departamento</label>
      </p-floatlabel>

      <p-floatlabel variant="on" class="w-full">
        <p-select
          [options]="localidades()"
          optionLabel="nombre"
          optionValue="id_localidad"
          class="w-full"
          appendTo="body"
          [filter]="true"
          [formField]="ubicacionForm.id_localidad"
        ></p-select>
        <label for="localidad">Localidad</label>
      </p-floatlabel>
    </div>

    <!-- Campo Comentarios -->
    <p-floatlabel variant="on" class="w-full">
      <textarea
        id="comentarios"
        rows="3"
        pTextarea
        autocomplete="off"
        class="w-full resize-none"
        [formField]="ubicacionForm.comentarios"
      ></textarea>
      <label for="comentarios">Comentarios</label>
    </p-floatlabel>
    <p>{{ ubicacionSeleccionada().latitud }} {{ ubicacionSeleccionada().longitud }}</p>
    <!-- Botones de Acción -->
    <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
      <button
        type="button"
        pButton
        class="p-button-text p-button-secondary p-button-sm"
        (click)="cerrarModalEdicion()"
      >
        <svg data-p-icon="times"></svg> Cancelar
      </button>

      <button type="submit" pButton class="p-button-sm">
        <svg data-p-icon="save"></svg> {{ esNuevaUbicacion() ? 'Crear' : 'Guardar' }}
      </button>
    </div>
  </form>
</p-dialog>
