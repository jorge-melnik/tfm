<div class="flex align-items-center justify-content-center min-h-screen bg-surface-ground p-4">
  <p-card class="shadow-4 border-round-xl w-full md:w-35rem">
    <ng-template #header>
      <div class="flex justify-content-center pt-6">
        <i class="pi pi-user-plus text-primary text-6xl"></i>
      </div>
    </ng-template>

    <ng-template #title>
      <div class="text-center text-900 text-3xl font-medium mb-1">Crear Cuenta</div>
    </ng-template>

    <ng-template #subtitle>
      <div class="text-center text-600 mb-5">Únete a De Acá y comienza a comprar</div>
    </ng-template>

    <form class="flex flex-column gap-4">
      <div class="flex justify-content-center mb-3">
        <p-selectButton
          [options]="[
            { label: 'Quiero Comprar', value: 'consumer', icon: 'pi pi-shopping-cart' },
            { label: 'Quiero Vender', value: 'producer', icon: 'pi pi-shop' },
          ]"
          [(ngModel)]="this.selectedRoles"
          optionLabel="label"
          optionValue="value"
          name="roleSelector"
          [multiple]="true"
          [allowEmpty]="false"
          styleClass="w-full"
        >
          <ng-template let-item pTemplate="item">
            <div class="flex flex-column align-items-center p-2" style="min-width: 100px">
              <i [class]="item.icon" class="text-2xl mb-2"></i>
              <span class="font-bold">{{ item.label }}</span>
            </div>
          </ng-template>
        </p-selectButton>
      </div>

      <div class="flex flex-column md:flex-row gap-4">
        <p-floatlabel variant="on" class="w-full">
          <p-iconfield iconPosition="right">
            <p-inputicon class="pi pi-id-card" />
            <input pInputText name="nombres" autocomplete="off" class="w-full" />
            <label for="nombres">Nombres</label>
          </p-iconfield>
        </p-floatlabel>

        <p-floatlabel variant="on" class="w-full">
          <p-iconfield iconPosition="right">
            <p-inputicon class="pi pi-id-card" />
            <input pInputText name="apellidos" autocomplete="off" class="w-full" />
            <label for="apellidos">Apellidos</label>
          </p-iconfield>
        </p-floatlabel>
      </div>

      <p-floatlabel variant="on">
        <p-iconfield iconPosition="right">
          <p-inputicon class="pi pi-envelope" />
          <input pInputText name="email" type="email" autocomplete="off" class="w-full" />
          <label for="email">Email</label>
        </p-iconfield>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-iconfield iconPosition="right">
          <p-inputicon class="pi pi-phone" />
          <input pInputText name="celular" type="tel" autocomplete="off" class="w-full" />
          <label for="celular">Celular</label>
        </p-iconfield>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-iconfield iconPosition="right">
          <p-inputicon class="pi pi-key" />
          <p-password
            name="password"
            [toggleMask]="true"
            [fluid]="true"
            promptLabel="Elige una contraseña"
            weakLabel="Débil"
            mediumLabel="Media"
            strongLabel="Fuerte"
            autocomplete="new-password"
          />
          <label for="password">Contraseña</label>
        </p-iconfield>
      </p-floatlabel>

      <p-button label="Registrarme" styleClass="w-full" severity="primary" />
    </form>

    <ng-template #footer>
      <p class="text-center text-600 mt-2">
        ¿Ya tienes una cuenta?
        <a routerLink="/auth/login" class="text-primary font-bold cursor-pointer no-underline">
          Inicia sesión
        </a>
      </p>
    </ng-template>
  </p-card>
</div>
